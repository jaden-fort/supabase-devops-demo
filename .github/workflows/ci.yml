name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "supabase/**"
      - "web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  local-database-smoke:
    name: Local database smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Verify RPC returns a database label
        run: |
          result="$(docker exec supabase_db_supabase-devops-demo psql -U postgres -d postgres -tAc "select public.demo_database_identity();")"
          test -n "$result"
          echo "RPC returned: $result"
