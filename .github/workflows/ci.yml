name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "supabase/**"
      - "web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  database-smoke:
    name: Database smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase database
        run: supabase db start

      - name: Verify RPC returns a database label
        run: |
          result="$(docker exec supabase_db_supabase-devops-demo psql -U postgres -d postgres -tAc "select public.demo_database_identity();")"
          test -n "$result"
          echo "RPC returned: $result"

      - name: Verify web app files exist
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/env.example.js
